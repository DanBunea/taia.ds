<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- One request of the counter example, looping every 13 s.
       0.6s click · 1.0–2.4 POST travels · 2.2 handler · 2.6 ctx · 4.4 transition · 6.6 render · 8.6 response · 9.8–11.2 HTML travels · 11.2 morph.
       Render to GIF: node e2e/render-flow.mjs docs/img/counter-flow.svg docs/img/counter-flow.gif -->
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 12px; fill: #6b7280; font-weight: 600; letter-spacing: .04em; }
      .note  { font-size: 11px; fill: #6b7280; }
      .title { font-size: 15px; fill: #1d2330; font-weight: 700; }
      .code  { font-size: 11px; fill: #1d2330; white-space: pre; }
      .dim   { fill: #9ca3af; }
      .kw    { fill: #7c3aed; }
      .str   { fill: #15803d; }
      .num   { fill: #b45309; }
      .box   { fill: #ffffff; stroke: #e5e7eb; }
      .step  { font-size: 12px; fill: #1d2330; }
      .stepn { font-size: 11px; fill: #ffffff; font-weight: 700; }
      .hl    { fill: #2563eb; opacity: 0; }
      .packett { font-size: 11px; fill: #ffffff; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="#f6f7f9"/>
  <text x="20" y="28" class="title">taia.ds — one event, end to end</text>
  <text x="20" y="46" class="note" style="font-size:12px">click → POST + signals → ctx → state-machine action → render → HTML → morph</text>

  <!-- ============ BROWSER (x 20–270) ============ -->
  <text x="20" y="80" class="label">BROWSER</text>
  <rect x="20" y="90" width="250" height="200" rx="12" class="box"/>
  <rect x="20" y="90" width="250" height="200" rx="12" fill="#2563eb" opacity="0">
    <animate attributeName="opacity" values="0;0;0.18;0;0" keyTimes="0;0.862;0.875;0.92;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="118" class="title">Counter</text>
  <g class="mono">
    <text x="40" y="178" font-size="44" font-weight="700" fill="#1d2330">1
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.862;0.863;0.999;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="178" font-size="44" font-weight="700" fill="#1d2330" opacity="0">2
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.862;0.863;0.999;1" dur="13s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="40" y="200" width="44" height="32" rx="8" fill="#2563eb"/>
  <text x="62" y="221" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">−</text>
  <rect x="92" y="200" width="44" height="32" rx="8" fill="#2563eb"/>
  <rect x="92" y="200" width="44" height="32" rx="8" fill="#1d2330" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.046;0.05;0.077;0.09;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <text x="114" y="221" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">+</text>
  <rect x="144" y="200" width="60" height="32" rx="8" fill="#e5e7eb"/>
  <text x="174" y="221" text-anchor="middle" font-size="13" fill="#1d2330">Reset</text>
  <!-- cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.03;0.085;0.1;1" dur="13s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="150 250;150 250;118 214;118 214;118 214" keyTimes="0;0.02;0.046;0.1;1" dur="13s" repeatCount="indefinite"/>
    <path d="M0 0 L0 16 L4.5 12.5 L8 20 L11 18.5 L7.5 11 L13 11 Z" fill="#1d2330" stroke="#fff" stroke-width="1.2"/>
  </g>
  <rect x="34" y="248" width="222" height="20" rx="4" fill="#2563eb" opacity="0">
    <animate attributeName="opacity" values="0;0;0.15;0.15;0;0" keyTimes="0;0.862;0.87;0.95;0.97;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="262" class="note">6 · Datastar morphs #counter1 by id</text>

  <!-- signal store -->
  <text x="20" y="318" class="label">SIGNAL STORE (data-signals)</text>
  <rect x="20" y="328" width="250" height="76" rx="12" class="box"/>
  <g class="mono code">
    <text x="32" y="350">{<tspan class="str">"counter1"</tspan>:</text>
    <text x="44" y="368">{<tspan class="str">"count"</tspan>: <tspan class="num">1</tspan>,
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.862;0.863;0.999;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="44" y="368" opacity="0">{<tspan class="str">"count"</tspan>: <tspan class="num">2</tspan>,
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.862;0.863;0.999;1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="44" y="386"><tspan class="str">"state"</tspan>: <tspan class="str">"displayed"</tspan>}}</text>
  </g>
  <text x="20" y="430" class="note">one store per page, keyed by component-id;</text>
  <text x="20" y="446" class="note">the whole store travels with every request,</text>
  <text x="20" y="462" class="note">this component's slice becomes :memory</text>

  <!-- ============ PACKETS ============ -->
  <!-- POST: from the + button to step 1, 1.0s–2.4s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.08;0.18;0.19;1" dur="13s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="114 216;114 216;320 112;320 112" keyTimes="0;0.077;0.185;1" dur="13s" repeatCount="indefinite"/>
    <rect x="-34" y="-15" width="68" height="30" rx="6" fill="#1d2330"/>
    <text x="0" y="-2" text-anchor="middle" class="packett">POST</text>
    <text x="0" y="10" text-anchor="middle" class="packett" style="font-weight:400">+ store</text>
  </g>
  <!-- HTML: from step 5 back to the count, 9.8s–11.2s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.752;0.756;0.86;0.865;1" dur="13s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="320 470;320 470;60 165;60 165" keyTimes="0;0.754;0.862;1" dur="13s" repeatCount="indefinite"/>
    <rect x="-34" y="-15" width="68" height="30" rx="6" fill="#15803d"/>
    <text x="0" y="-2" text-anchor="middle" class="packett">200</text>
    <text x="0" y="10" text-anchor="middle" class="packett" style="font-weight:400">text/html</text>
  </g>

  <!-- ============ SERVER PIPELINE (x 350–690) ============ -->
  <text x="350" y="80" class="label">SERVER · taia.ds pipeline</text>
  <g>
    <rect x="350" y="90" width="340" height="72" rx="10" class="box"/>
    <rect x="350" y="90" width="340" height="72" rx="10" class="hl">
      <animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.169;0.175;0.3;0.31;1" dur="13s" repeatCount="indefinite"/>
    </rect>
    <circle cx="368" cy="108" r="9" fill="#1d2330"/><text x="368" y="112" text-anchor="middle" class="stepn">1</text>
    <text x="384" y="112" class="step">handler-component-event</text>
    <text x="362" y="132" class="mono code"><tspan class="kw">POST</tspan> /ds/nds/basics.counter/counter1/increment</text>
    <text x="362" y="150" class="mono code dim">body = the signal store (JSON)</text>
  </g>
  <g>
    <rect x="350" y="172" width="340" height="72" rx="10" class="box"/>
    <rect x="350" y="172" width="340" height="72" rx="10" class="hl">
      <animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.2;0.206;0.335;0.345;1" dur="13s" repeatCount="indefinite"/>
    </rect>
    <circle cx="368" cy="190" r="9" fill="#1d2330"/><text x="368" y="194" text-anchor="middle" class="stepn">2</text>
    <text x="384" y="194" class="step">ctx from the store slice · event upper-cased</text>
    <text x="362" y="214" class="mono code">{:state <tspan class="kw">:displayed</tspan>, :memory {:count <tspan class="num">1</tspan>}}</text>
    <text x="362" y="232" class="mono code">event ⇒ [<tspan class="kw">:INCREMENT</tspan> {}]</text>
  </g>
  <g>
    <rect x="350" y="254" width="340" height="88" rx="10" class="box"/>
    <rect x="350" y="254" width="340" height="88" rx="10" class="hl">
      <animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.338;0.344;0.5;0.51;1" dur="13s" repeatCount="indefinite"/>
    </rect>
    <circle cx="368" cy="272" r="9" fill="#1d2330"/><text x="368" y="276" text-anchor="middle" class="stepn">3</text>
    <text x="384" y="276" class="step">transition → the controller's action</text>
    <text x="362" y="296" class="mono code">(transition machine ctx [<tspan class="kw">:INCREMENT</tspan> {}])</text>
    <text x="362" y="314" class="mono code dim">;; runs (increment ctx {})</text>
    <text x="362" y="332" class="mono code">⇒ {:state <tspan class="kw">:displayed</tspan>, :memory {:count <tspan class="num" font-weight="700">2</tspan>}}</text>
  </g>
  <g>
    <rect x="350" y="352" width="340" height="72" rx="10" class="box"/>
    <rect x="350" y="352" width="340" height="72" rx="10" class="hl">
      <animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.508;0.514;0.655;0.665;1" dur="13s" repeatCount="indefinite"/>
    </rect>
    <circle cx="368" cy="370" r="9" fill="#1d2330"/><text x="368" y="374" text-anchor="middle" class="stepn">4</text>
    <text x="384" y="374" class="step">render: the component fn, new ctx → hiccup</text>
    <text x="362" y="394" class="mono code">(counter ctx)</text>
    <text x="362" y="412" class="mono code">⇒ [:div.card {:id <tspan class="str">"counter1"</tspan> …} [:p.big <tspan class="str">"2"</tspan>] …]</text>
  </g>
  <g>
    <rect x="350" y="434" width="340" height="72" rx="10" class="box"/>
    <rect x="350" y="434" width="340" height="72" rx="10" class="hl">
      <animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.662;0.668;0.75;0.76;1" dur="13s" repeatCount="indefinite"/>
    </rect>
    <circle cx="368" cy="452" r="9" fill="#1d2330"/><text x="368" y="456" text-anchor="middle" class="stepn">5</text>
    <text x="384" y="456" class="step">hiccup → HTML (chassis) → 200 text/html</text>
    <text x="362" y="476" class="mono code">&lt;div id=<tspan class="str">"counter1"</tspan> data-signals=<tspan class="str">'{"counter1":</tspan></text>
    <text x="362" y="494" class="mono code"><tspan class="str">{"count":2,…}}'</tspan>&gt;…&lt;p class="big"&gt;2&lt;/p&gt;…&lt;/div&gt;</text>
  </g>
  <line x1="520" y1="162" x2="520" y2="172" stroke="#9ca3af" marker-end="url(#arrow)"/>
  <line x1="520" y1="244" x2="520" y2="254" stroke="#9ca3af" marker-end="url(#arrow)"/>
  <line x1="520" y1="342" x2="520" y2="352" stroke="#9ca3af" marker-end="url(#arrow)"/>
  <line x1="520" y1="424" x2="520" y2="434" stroke="#9ca3af" marker-end="url(#arrow)"/>

  <!-- ============ CODE (x 720–1000) ============ -->
  <text x="720" y="80" class="label">counter_controller.clj</text>
  <rect x="720" y="90" width="300" height="196" rx="10" class="box"/>
  <rect x="720" y="90" width="300" height="196" rx="10" class="hl">
    <animate attributeName="opacity" values="0;0;0.08;0.08;0;0" keyTimes="0;0.338;0.344;0.5;0.51;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <rect x="726" y="98" width="288" height="36" rx="4" fill="#fde68a" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.338;0.344;0.5;0.51;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <rect x="726" y="242" width="288" height="18" rx="4" fill="#fde68a" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.338;0.344;0.5;0.51;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <g class="mono code">
    <text x="730" y="112">(<tspan class="kw">defn</tspan> increment [ctx _]</text>
    <text x="730" y="130">  (update-in ctx [:memory :count] inc))</text>
    <text x="730" y="166">(<tspan class="kw">def</tspan> machine</text>
    <text x="730" y="184">  {:id      :counter</text>
    <text x="730" y="202">   :initial :displayed</text>
    <text x="730" y="220">   :states  {:displayed</text>
    <text x="730" y="238">             {:on {<tspan class="kw">:INCREMENT</tspan></text>
    <text x="730" y="256">                   {:actions increment}</text>
    <text x="730" y="274">                   …}}}})</text>
  </g>

  <text x="720" y="318" class="label">counter.clj</text>
  <rect x="720" y="328" width="300" height="218" rx="10" class="box"/>
  <rect x="720" y="328" width="300" height="218" rx="10" class="hl">
    <animate attributeName="opacity" values="0;0;0.08;0.08;0;0" keyTimes="0;0.508;0.514;0.655;0.665;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <rect x="726" y="408" width="288" height="54" rx="4" fill="#fde68a" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.508;0.514;0.655;0.665;1" dur="13s" repeatCount="indefinite"/>
  </rect>
  <g class="mono code">
    <text x="730" y="350">(<tspan class="kw">defn</tspan> counter</text>
    <text x="730" y="368">  [{:keys [component-id memory] :as ctx}]</text>
    <text x="730" y="386">  [:div.card</text>
    <text x="730" y="404">   {:id component-id</text>
    <text x="730" y="422">    :data-signals</text>
    <text x="730" y="440">    (ds/ctx-&gt;data-signals ctx)}</text>
    <text x="730" y="458">   [:p.big (str (:count memory))]</text>
    <text x="730" y="476">   [:button</text>
    <text x="730" y="494">    {<tspan class="str">"data-on:click"</tspan></text>
    <text x="730" y="512">     (post component-id <tspan class="str">"increment"</tspan>)}</text>
    <text x="730" y="530">    <tspan class="str">"+"</tspan>]])</text>
  </g>
  <text x="720" y="568" class="note">the render fn is the only source of markup;</text>
  <text x="720" y="584" class="note">:memory is all that survives the request</text>
</svg>
